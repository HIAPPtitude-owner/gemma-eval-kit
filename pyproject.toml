[project]
name = "gemma-eval-kit"
version = "0.1.0"
description = "A repaired, diagnosed, documented-model local evaluator for the Gemma 4 developer agent competition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
factory = "factory.eval_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src"]
